<!DOCTYPE html>
<html>
<head>
<title>My Game Hub</title>
<style>
body {
  background: #000;
  color: white;
  font-family: Arial;
  text-align: center;
  padding: 20px;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image: radial-gradient(#168bff 1.5px, transparent 1.5px);
  background-size: 35px 35px;
  opacity: .4;
  pointer-events: none;
  z-index: -1;
}
button {
  padding: 14px;
  margin: 6px;
  background: #111;
  color: white;
  border: 1px solid #168bff;
  border-radius: 10px;
  cursor: pointer;
}
iframe {
  width: 100%;
  height: 70vh;
  border: 1px solid #168bff;
  border-radius: 10px;
  background: #111;
}
</style>
</head>
<body>

<h1 style="color:#38bdf8">🎮 My Game Hub</h1>
<p>Games, anime and more!</p>

<h2>🎮 Games</h2>
<button onclick="openSite('https://poki.com/')">Poki</button>
<button onclick="openSite('https://www.crazygames.com/')">CrazyGames</button>
<button onclick="openSite('https://www.coolmathgames.com/')">Cool Math Games</button>

<h2>🍿 Anime</h2>
<button onclick="openSite('https://yomi.to/')">Yomi</button>
<button onclick="openSite('https://www.youtube.com/')">YouTube</button>

<h2 id="siteTitle">Choose a website</h2>
<iframe id="browser" src="about:blank"></iframe>
<p id="notice">If a site blocks embedding, it may not load here.</p>

<script>
function openSite(url) {
  document.getElementById("browser").src = url;
  document.getElementById("siteTitle").textContent = "Website";
}
</script>

</body>
</html>
