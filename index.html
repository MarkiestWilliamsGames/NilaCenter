
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nila</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 24px;
  background: #05070b;
  color: white;
  font-family: Arial, sans-serif;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image: radial-gradient(#168bff 1px, transparent 1px);
  background-size: 32px 32px;
  opacity: .25;
  pointer-events: none;
  z-index: -1;
}

header {
  max-width: 1050px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0 25px;
  border-bottom: 1px solid #182536;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 25px;
  font-weight: bold;
}

.diamond {
  color: #38bdf8;
  font-size: 34px;
  text-shadow: 0 0 18px #168bff;
}

.status {
  color: #38bdf8;
  border: 1px solid #16456b;
  background: #081522;
  border-radius: 20px;
  padding: 8px 13px;
  font-size: 12px;
}

main {
  max-width: 1050px;
  margin: 55px auto;
}

.hero {
  padding: 35px 20px;
  border: 1px solid #19344d;
  border-radius: 22px;
  background: linear-gradient(135deg, #0d1724, #05070b 70%);
  text-align: center;
}

.eyebrow {
  color: #38bdf8;
  letter-spacing: 3px;
  font-size: 11px;
}

h1 {
  font-size: clamp(36px, 6vw, 55px);
  margin: 18px 0 10px;
}

h1 span { color: #38bdf8; }
.subtitle { color: #9caec0; }

.search {
  display: flex;
  max-width: 580px;
  margin: 28px auto 0;
  padding: 5px;
  border: 1px solid #24577e;
  border-radius: 12px;
  background: #050a11;
}

.search input {
  flex: 1;
  min-width: 0;
  background: transparent;
  color: white;
  border: none;
  outline: none;
  padding: 13px;
  font-size: 15px;
}

button {
  background: #087fc1;
  color: white;
  border: 1px solid #168bff;
  border-radius: 9px;
  padding: 11px 15px;
  cursor: pointer;
}

button:hover { background: #09649a; }

.section { margin-top: 38px; }

.section-heading {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}

.section-heading span { color: #38bdf8; }
.section-heading h2 { font-size: 16px; }

.sites {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 16px;
}

.site {
  background: #0b1018;
  border: 1px solid #1a3045;
  border-radius: 15px;
  padding: 22px;
  transition: border-color .2s, transform .2s;
}

.site:hover {
  border-color: #168bff;
  transform: translateY(-3px);
}

.site-icon { font-size: 26px; }
.site h3 { margin: 15px 0 8px; }

.site p {
  color: #9caec0;
  font-size: 14px;
  line-height: 1.5;
}

.site button {
  margin-top: 10px;
  width: 100%;
}

#viewer {
  display: none;
  margin-top: 35px;
}

#browser {
  width: 100%;
  height: 65vh;
  border: 1px solid #168bff;
  border-radius: 12px;
  background: #111;
  margin-top: 15px;
}

footer {
  max-width: 1050px;
  margin: 55px auto 0;
  padding-top: 20px;
  border-top: 1px solid #182536;
  color: #718096;
  text-align: center;
  font-size: 12px;
}

/* Blue custom cursor */
@media (pointer: fine) {
  body, button, a, input {
    cursor: none !important;
  }

  #cursor-dot, #cursor-ring {
    position: fixed;
    top: 0;
    left: 0;
    pointer-events: none;
    border-radius: 50%;
    z-index: 99999;
    transform: translate(-50%, -50%);
  }

  #cursor-dot {
    width: 5px;
    height: 5px;
    background: #087bff;
  }

  #cursor-ring {
    width: 25px;
    height: 25px;
    border: 1px solid #087bff;
    box-shadow: 0 0 8px #087bff;
  }
}
</style>
</head>

<body>

<header>
  <div class="brand"><span class="diamond">◆</span> Nila</div>
  <div class="status">YOUR SPACE</div>
</header>

<main>
  <section class="hero">
    <div class="eyebrow">WELCOME TO YOUR HUB</div>
    <h1>Explore <span>Nila.</span></h1>
    <p class="subtitle">Your place for games, anime and discovery.</p>

    <form class="search"
          action="https://www.google.com/search"
          method="GET"
          target="_blank">
      <input name="q" placeholder="Search Google..." required>
      <button type="submit">Search ↗</button>
    </form>
  </section>

  <section class="section">
    <div class="section-heading">
      <span>◆</span>
      <h2>QUICK ACCESS</h2>
    </div>

    <div class="sites">
      <article class="site">
        <div class="site-icon">🎮</div>
        <h3>Cool Math Games</h3>
        <p>Play games, solve puzzles, and challenge yourself.</p>
        <button onclick="openSite('https://www.coolmathgames.com/')">
          Open website ↗
        </button>
      </article>

      <article class="site">
        <div class="site-icon">🍿</div>
        <h3>Yomi</h3>
        <p>Visit the anime website.</p>
        <button onclick="openSite('https://yomi.to/')">
          Open website ↗
        </button>
      </article>
    </div>
  </section>

  <section id="viewer">
    <button onclick="closeSite()">← Back to Nila</button>
    <h2 id="viewTitle">Website</h2>
    <iframe id="browser" src="about:blank"></iframe>
    <p class="subtitle">Some websites prevent embedded viewing.</p>
  </section>
</main>

<footer>NILA ◆ YOUR SPACE, YOUR WAY</footer>

<!-- Cursor -->
<div id="cursor-dot"></div>
<div id="cursor-ring"></div>

<script>
function openSite(url) {
  document.getElementById("browser").src = url;
  document.getElementById("viewTitle").textContent =
    new URL(url).hostname;
  document.getElementById("viewer").style.display = "block";
  document.getElementById("viewer").scrollIntoView();
}

function closeSite() {
  document.getElementById("browser").src = "about:blank";
  document.getElementById("viewer").style.display = "none";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

const dot = document.getElementById("cursor-dot");
const ring = document.getElementById("cursor-ring");

document.addEventListener("mousemove", function(e) {
  dot.style.left = e.clientX + "px";
  dot.style.top = e.clientY + "px";
  ring.style.left = e.clientX + "px";
  ring.style.top = e.clientY + "px";
});
</script>

</body>
</html>
