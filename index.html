<!DOCTYPE html>
<html>
<head>
<title>Nila</title>
<style>
body {
  background: #000;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image: radial-gradient(#168bff 1.5px, transparent 1.5px);
  background-size: 35px 35px;
  opacity: .4;
  pointer-events: none;
  z-index: -1;
}
button, input {
  padding: 14px;
  margin: 6px;
  background: #111;
  color: white;
  border: 1px solid #168bff;
  border-radius: 10px;
}
button { cursor: pointer; }
iframe {
  width: 100%;
  height: 70vh;
  border: 1px solid #168bff;
  border-radius: 10px;
  background: #111;
}
#search { width: 65%; max-width: 450px; }
</style>
</head>
<body>

<h1 style="color:#38bdf8">Nila</h1>
<p>Games, anime and more!</p>

<form action="https://www.google.com/search" method="GET" target="_blank">
  <input id="search" type="text" name="q" placeholder="Search Google...">
  <button type="submit">Search</button>
</form>

<h2>🎮 Games</h2>
<button onclick="openSite('https://www.coolmathgames.com/')">Cool Math Games</button>

<h2>🍿 Anime</h2>
<button onclick="openSite('https://yomi.to/')">Yomi</button>

<h2 id="siteTitle">Choose a website</h2>
<iframe id="browser" src="about:blank"></iframe>
<p id="notice">Some websites block embedded viewing.</p>

<h3>Server Status</h3>
<p id="serverStatus">Checking Nila server...</p>

<script>
function openSite(url) {
  document.getElementById("browser").src = url;
  document.getElementById("siteTitle").textContent = "Nila Browser";
}

fetch("https://nilacenter.onrender.com")
  .then(response => {
    if (!response.ok) throw new Error("Server error");
    return response.text();
  })
  .then(() => {
    document.getElementById("serverStatus").textContent =
      "Nila server is online!";
  })
  .catch(() => {
    document.getElementById("serverStatus").textContent =
      "Server unavailable. Try again later.";
  });
</script>

</body>
</html>
